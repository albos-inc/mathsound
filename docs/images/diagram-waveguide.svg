<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', 'Noto Sans CJK JP', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#687082"/></marker>
  <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4084ff"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22a06b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="459" rx="16" fill="#ffffff" stroke="#d9dde5"/>
<text x="30" y="40" font-size="19" font-weight="700" fill="#1f2430">One string, computed one sample at a time</text>

<!-- Nut -->
<rect x="30" y="120" width="54" height="150" rx="10" fill="#f4f6f9" stroke="#d9dde5"/>
<text x="57" y="200" font-size="13" fill="#1f2430" text-anchor="middle">Nut</text>
<text x="57" y="218" font-size="11" fill="#687082" text-anchor="middle">inverting reflection</text>

<!-- Right-going wave (upper delay line) -->
<rect x="96" y="128" width="520" height="40" rx="8" fill="#eef4ff" stroke="#c7d7ff"/>
<path d="M 100 148 L 606 148" stroke="#4084ff" stroke-width="2" marker-end="url(#arrowB)"/>
<path d="M 180 148 C 195 148 200 120 215 120 S 235 148 250 148" fill="none" stroke="#4084ff" stroke-width="3"/>
<text x="612" y="118" font-size="11" fill="#4084ff" text-anchor="end">Right-going wave (a delay line: one step per sample)</text>

<!-- Left-going wave (lower delay line) -->
<rect x="96" y="222" width="520" height="40" rx="8" fill="#eefaf3" stroke="#bfe8d2"/>
<path d="M 612 242 L 106 242" stroke="#22a06b" stroke-width="2" marker-end="url(#arrowG)"/>
<path d="M 420 242 C 435 242 440 270 455 270 S 475 242 490 242" fill="none" stroke="#22a06b" stroke-width="3"/>
<text x="356" y="284" font-size="12" fill="#22a06b" text-anchor="middle">Left-going travelling wave</text>

<!-- Hammer junction -->
<line x1="160" y1="128" x2="160" y2="262" stroke="#9b6bff" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M 160 300 L 160 268" stroke="#9b6bff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="128" y="300" width="64" height="24" rx="8" fill="#9b6bff"/>
<rect x="150" y="324" width="20" height="40" rx="5" fill="#6e4b1f"/>
<text x="160" y="316" font-size="11" fill="#ffffff" text-anchor="middle">felt</text>
<text x="160" y="384" font-size="12" fill="#1f2430" text-anchor="middle">Hammer</text>
<text x="160" y="402" font-size="11" fill="#687082" text-anchor="middle">F = K x^p solved implicitly every sample</text>
<text x="160" y="418" font-size="11" fill="#687082" text-anchor="middle">force injected into both waves</text>

<!-- Damper junction -->
<line x1="250" y1="128" x2="250" y2="262" stroke="#fa8c28" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="226" y="72" width="48" height="22" rx="6" fill="#fa8c28"/>
<path d="M 250 94 L 250 124" stroke="#fa8c28" stroke-width="3" marker-end="url(#arrow)"/>
<text x="250" y="64" font-size="12" fill="#1f2430" text-anchor="middle">Damper</text>
<text x="300" y="86" font-size="11" fill="#687082" text-anchor="start">adds a resistance −R·v proportional to velocity</text>
<text x="300" y="101" font-size="11" fill="#687082" text-anchor="start">R rises over 25 ms after key-up</text>

<!-- Loop filters (bridge end) -->
<rect x="630" y="128" width="110" height="134" rx="10" fill="#f4f6f9" stroke="#d9dde5"/>
<text x="685" y="150" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle">Per round trip</text>
<text x="685" y="166" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle">filters</text>
<text x="685" y="190" font-size="11" fill="#687082" text-anchor="middle">loss (one-pole IIR)</text>
<text x="685" y="208" font-size="11" fill="#687082" text-anchor="middle">dispersion (allpass ×60)</text>
<text x="685" y="226" font-size="11" fill="#687082" text-anchor="middle">fractional delay (Thiran)</text>
<text x="685" y="282" font-size="9" fill="#687082" text-anchor="middle">set decay times and inharmonicity</text>
<path d="M 616 148 L 630 148" stroke="#4084ff" stroke-width="2"/>
<path d="M 630 242 L 616 242" stroke="#22a06b" stroke-width="2"/>

<!-- Bridge -->
<rect x="760" y="120" width="110" height="150" rx="10" fill="#f4f6f9" stroke="#d9dde5"/>
<text x="815" y="150" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">Bridge</text>
<text x="815" y="170" font-size="11" fill="#687082" text-anchor="middle">v_b = Y_b · ΣF</text>
<text x="815" y="186" font-size="11" fill="#687082" text-anchor="middle">moved by the sum</text>
<text x="815" y="200" font-size="11" fill="#687082" text-anchor="middle">of string forces</text>
<text x="815" y="222" font-size="11" fill="#687082" text-anchor="middle">couples the unison</text>
<text x="815" y="236" font-size="11" fill="#687082" text-anchor="middle">and all other keys</text>
<text x="815" y="256" font-size="10" fill="#687082" text-anchor="middle">beats, 2-stage decay</text>
<path d="M 740 148 L 760 148" stroke="#4084ff" stroke-width="2" marker-end="url(#arrowB)"/>
<path d="M 760 242 L 740 242" stroke="#22a06b" stroke-width="2" marker-end="url(#arrowG)"/>
<!-- Other strings -->
<path d="M 815 300 L 815 274" stroke="#687082" stroke-width="2" marker-end="url(#arrow)"/>
<text x="748" y="318" font-size="10" fill="#687082" text-anchor="end">the other 87 keys' strings (ring with the pedal)</text>

<!-- Output -->
<rect x="500" y="356" width="212" height="40" rx="10" fill="#f4f6f9" stroke="#d9dde5"/>
<text x="606" y="374" font-size="12" font-weight="700" fill="#1f2430" text-anchor="middle">Soundboard EQ</text>
<text x="606" y="389" font-size="10" fill="#687082" text-anchor="middle">minimum-phase filter identified from the recording</text>
<path d="M 815 300 L 815 330 L 760 330 L 760 376 L 712 376" fill="none" stroke="#687082" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="362" font-size="11" fill="#687082" text-anchor="start">force on the bridge ΣF</text>
<path d="M 500 376 L 450 376" stroke="#687082" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="381" font-size="13" font-weight="700" fill="#1f2430" text-anchor="end">Sound</text>
<text x="30" y="440" font-size="11" fill="#687082">Runs at 96 kHz; one way along the string is about 180 samples at C4. Only delay-line reads and writes, filters and junction algebra: no matrices, no FFT.</text>
</svg>
