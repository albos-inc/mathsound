<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 黒漆と金。グランドピアノを上から見た交差弦の扇と駒。1 本が振動している。 -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a2f"/>
      <stop offset="0.45" stop-color="#121115"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e7b9"/>
      <stop offset="0.35" stop-color="#d9b36a"/>
      <stop offset="0.62" stop-color="#a8823f"/>
      <stop offset="1" stop-color="#f1d79a"/>
    </linearGradient>
    <linearGradient id="goldWire" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="880">
      <stop offset="0" stop-color="#b8924e" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#f6e2a8"/>
      <stop offset="0.6" stop-color="#d6ad5f"/>
      <stop offset="1" stop-color="#9c7a3c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#d9d1c0"/>
    </linearGradient>
    <!-- 胡桃材の芯と柄（黒漆の上でも輪郭が読めるように少し明るく） -->
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2b"/>
      <stop offset="0.7" stop-color="#3f2a16"/>
      <stop offset="1" stop-color="#2a1b0e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="waveGlow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="7" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#lacquer)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- 中高音弦（縦の扇） -->
    <g fill="none" stroke="url(#goldWire)" stroke-width="7" stroke-linecap="round" opacity="0.9">
      <path d="M 300 170 L 250 860"/>
      <path d="M 348 170 L 308 860"/>
      <path d="M 396 170 L 366 860"/>
      <path d="M 444 170 L 424 860"/>
      <path d="M 492 170 L 482 860"/>
      <path d="M 540 170 L 540 860"/>
      <path d="M 588 170 L 598 860"/>
      <path d="M 636 170 L 656 860"/>
      <path d="M 684 170 L 714 860"/>
    </g>
    <!-- 低音弦（交差して手前を通る、巻線なので太い） -->
    <g fill="none" stroke="#e2c17a" stroke-linecap="round" opacity="0.95">
      <path d="M 150 210 L 870 470" stroke-width="11.0"/>
      <path d="M 150 256 L 870 516" stroke-width="10.4"/>
      <path d="M 150 302 L 870 562" stroke-width="9.8"/>
      <path d="M 150 348 L 870 608" stroke-width="9.2"/>
      <path d="M 150 394 L 870 654" stroke-width="8.6"/>
      <path d="M 150 440 L 870 700" stroke-width="8.0"/>
    </g>
    <!-- 駒: 弦を響板に渡す湾曲した木 -->
    <path d="M 250 600 C 420 540, 700 560, 880 700" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 250 600 C 420 540, 700 560, 880 700" fill="none" stroke="#5a3b1c" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <!-- 打たれた 1 本の振動包絡 -->
    <path filter="url(#waveGlow)" d="M 492 170 Q 420 515 482 860" fill="none" stroke="#f6e2a8" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <path filter="url(#waveGlow)" d="M 492 170 Q 564 515 482 860" fill="none" stroke="#f6e2a8" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <path d="M 100 100 H 924 V 330 C 700 390, 330 390, 100 300 Z" fill="url(#sheen)"/>
  </g>
  <rect x="118" y="118" width="788" height="788" rx="168" fill="none" stroke="url(#gold)" stroke-width="7" opacity="0.9"/>
</svg>
