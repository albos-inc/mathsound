<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- sf2studio と同じ黒漆・シャンパンゴールドの様式。ハンマーが 3 本の弦の 1 本を打ち、その弦が振動の包絡を描く。 -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a2f"/>
      <stop offset="0.45" stop-color="#121115"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e7b9"/>
      <stop offset="0.35" stop-color="#d9b36a"/>
      <stop offset="0.62" stop-color="#a8823f"/>
      <stop offset="1" stop-color="#f1d79a"/>
    </linearGradient>
    <linearGradient id="goldWire" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="854" y2="0">
      <stop offset="0" stop-color="#b8924e" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#f6e2a8"/>
      <stop offset="0.6" stop-color="#d6ad5f"/>
      <stop offset="1" stop-color="#9c7a3c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#d9d1c0"/>
    </linearGradient>
    <!-- 胡桃材の芯と柄（黒漆の上でも輪郭が読めるように少し明るく） -->
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2b"/>
      <stop offset="0.7" stop-color="#3f2a16"/>
      <stop offset="1" stop-color="#2a1b0e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="waveGlow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="7" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#lacquer)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- 弦 3 本（金の針金）と、打たれた弦の振動包絡 -->
    <g fill="none" stroke-linecap="round">
      <path d="M 184 318 L 840 318" stroke="url(#goldWire)" stroke-width="9"/>
      <path d="M 184 418 L 840 418" stroke="url(#goldWire)" stroke-width="9"/>
      <path d="M 184 540 L 840 540" stroke="#d9b36a" stroke-opacity="0.35" stroke-width="7"/>
      <path filter="url(#waveGlow)" d="M 184 540 Q 512 372 840 540" stroke="url(#goldWire)" stroke-width="12"/>
      <path filter="url(#waveGlow)" d="M 184 540 Q 512 708 840 540" stroke="url(#goldWire)" stroke-width="12"/>
    </g>
    <!-- アグラフ（弦の支点） -->
    <g fill="url(#gold)">
      <circle cx="170" cy="318" r="16"/>
      <circle cx="170" cy="418" r="16"/>
      <circle cx="170" cy="540" r="16"/>
      <circle cx="854" cy="318" r="16"/>
      <circle cx="854" cy="418" r="16"/>
      <circle cx="854" cy="540" r="16"/>
    </g>

    <!-- ハンマー: 象牙色のフェルト、黒檀の芯と柄 -->
    <g>
      <rect x="492" y="800" width="40" height="160" rx="12" fill="url(#walnut)"/>
      <rect x="412" y="742" width="200" height="84" rx="24" fill="url(#walnut)"/>
      <rect x="412" y="742" width="200" height="12" rx="6" fill="url(#gold)" opacity="0.9"/>
      <path d="M 418 748 C 418 672 468 622 512 622 C 556 622 606 672 606 748 Z" fill="url(#ivory)"/>
    </g>

    <path d="M 100 100 H 924 V 330 C 700 390, 330 390, 100 300 Z" fill="url(#sheen)"/>
  </g>
  <rect x="118" y="118" width="788" height="788" rx="168" fill="none" stroke="url(#gold)" stroke-width="7" opacity="0.9"/>
</svg>
